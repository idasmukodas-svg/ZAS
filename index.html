<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistem Manajemen Klub Renang</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans">

  <!-- Navbar Utama (Tampil setelah login) -->
  <header id="app-header" class="hidden bg-sky-700 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="font-bold text-lg tracking-tight">SwimClub Manager</h1>
        <p id="user-role-badge" class="text-xs text-sky-200 uppercase font-semibold"></p>
      </div>
      <div class="flex items-center gap-3">
        <span id="user-display-name" class="text-sm hidden sm:inline"></span>
        <button id="btn-logout" class="bg-sky-800 hover:bg-sky-900 px-3 py-1.5 rounded-lg text-xs font-medium transition">
          Keluar
        </button>
      </div>
    </div>
    <!-- Navigasi Tab Dinamis Sesuai Role -->
    <nav id="role-nav" class="bg-sky-800/80 border-t border-sky-600/50 overflow-x-auto">
      <div id="role-nav-items" class="max-w-6xl mx-auto px-4 flex gap-2 py-2 text-sm whitespace-nowrap"></div>
    </nav>
  </header>

  <!-- Container Konten Utama -->
  <main id="app-main" class="max-w-6xl mx-auto p-4 sm:p-6">
    <!-- Loading State -->
    <div id="loading-screen" class="flex flex-col items-center justify-center py-20">
      <div class="w-10 h-10 border-4 border-sky-600 border-t-transparent rounded-full animate-spin"></div>
      <p class="mt-3 text-sm text-slate-500">Memuat sistem klub...</p>
    </div>

    <!-- Halaman Auth (Login & Pendaftaran Peserta Baru) -->
    <section id="auth-view" class="hidden max-w-md mx-auto mt-6 bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <div class="flex border-b border-slate-200 mb-5">
        <button id="tab-login" class="flex-1 pb-2.5 text-sm font-semibold border-b-2 border-sky-600 text-sky-700">Masuk Akun</button>
        <button id="tab-register" class="flex-1 pb-2.5 text-sm font-semibold border-b-2 border-transparent text-slate-500">Daftar Peserta Baru</button>
      </div>

      <!-- Form Login -->
      <form id="form-login" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Email</label>
          <input type="email" id="login-email" required class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-sky-600" placeholder="nama@email.com" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
          <input type="password" id="login-password" required class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-sky-600" placeholder="••••••••" />
        </div>
        <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-semibold py-2.5 rounded-lg text-sm transition">
          Masuk ke Sistem
        </button>
      </form>

      <!-- Form Pendaftaran Orang Tua & Peserta Baru -->
      <form id="form-register" class="hidden space-y-3.5">
        <p class="text-xs text-slate-500 bg-sky-50 p-2.5 rounded-lg border border-sky-100">
          Pendaftaran dilakukan oleh Orang Tua/Wali. Akun ini sekaligus digunakan untuk absensi kehadiran anak di kolam.
        </p>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Orang Tua / Wali</label>
          <input type="text" id="reg-parent-name" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" />
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">No. WhatsApp</label>
            <input type="tel" id="reg-wa" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" placeholder="08..." />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Email Login</label>
            <input type="email" id="reg-email" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Password Akun</label>
          <input type="password" id="reg-password" minlength="6" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" />
        </div>
        <hr class="my-2 border-slate-200" />
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Lengkap Anak (Peserta)</label>
          <input type="text" id="reg-child-name" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal Lahir</label>
            <input type="date" id="reg-child-dob" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Jenis Kelamin</label>
            <select id="reg-child-gender" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
              <option value="L">Laki-laki</option>
              <option value="P">Perempuan</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Kategori Awal yang Diminati</label>
          <select id="reg-category" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
            <option value="siswa">Siswa (Belajar Renang / Pemula)</option>
            <option value="atlet">Atlet (Pembinaan & Prestasi)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Catatan Medis / Alergi (Opsional)</label>
          <input type="text" id="reg-medical" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" placeholder="Contoh: Tidak ada / asma ringan" />
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg text-sm transition">
          Kirim Pendaftaran
        </button>
      </form>
    </section>

    <!-- Workspace Dinamis Berdasarkan Role -->
    <section id="workspace-view" class="hidden"></section>
  </main>

  <script type="module" src="./js/auth.js"></script>
</body>
</html>
